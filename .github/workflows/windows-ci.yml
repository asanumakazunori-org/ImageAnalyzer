name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on:
      - self-hosted
      - windows
      - x64

    defaults:
      run:
        shell: cmd

    steps:
      # --------------------------------------------------
      # 1) ソース取得
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2) CMake Configure（preset=release）
      #    ※ vcvars64.bat + cmake を同じステップ内で実行
      # --------------------------------------------------
      - name: Configure CMake (Release)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" --preset release

      # --------------------------------------------------
      # 3) ビルド（build/release）
      # --------------------------------------------------
      - name: Build (Release)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" --build build/release --config Release

      # --------------------------------------------------
      # 4) テスト実行（ctest）
      # --------------------------------------------------
      - name: Run Tests
        run: |
          cd build\release
          ctest -C Release --output-on-failure

      # --------------------------------------------------
      # 5) アーティファクト（exe + DLL + Qt platforms）
      # --------------------------------------------------
      - name: Package artifacts
        run: |
          mkdir artifact
          copy build\release\ImageViewer.exe artifact\

          rem CMakeLists 側の POST_BUILD で Qt / OpenCV の DLL が
          rem build\release にコピーされている前提で、そのまま同梱
          copy build\release\*.dll artifact\

          rem Qt の platforms ディレクトリがあれば一緒に格納
          if exist build\release\platforms (
            mkdir artifact\platforms
            copy build\release\platforms\*.dll artifact\platforms\
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer
          path: artifact
