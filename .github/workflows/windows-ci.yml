name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" `
            -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" `
            --build build --config Debug

      - name: Run GoogleTest
        run: build\Debug\ImageProcTests.exe

      - name: Run Cppcheck
        continue-on-error: true
        run: |
          cppcheck `
            --enable=all --inconclusive `
            --std=c++17 --language=c++ `
            --platform=win64 `
            --suppress=missingIncludeSystem `
            --output-file=cppcheck-report.txt `
            ImageProc ImageViewer

      - name: Run OpenCppCoverage
        run: |
          "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" `
            --export_type=cobertura:coverage.xml `
            --sources "${{ github.workspace }}" `
            --excluded_sources "${{ github.workspace }}\build" `
            -- "${{ github.workspace }}\build\Debug\ImageProcTests.exe"

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-reports
          path: |
            cppcheck-report.txt
            coverage.xml
            build\Debug\ImageProcTests.exe
