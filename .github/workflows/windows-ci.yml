name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on:
      - self-hosted
      - windows
      - x64

    # よく使うパスを env にまとめておく
    env:
      CMAKE_BIN: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin"
      VCVARS_BAT: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\VC\\Auxiliary\\Build\\vcvars64.bat"

    defaults:
      run:
        shell: cmd

    steps:
      # --------------------------------------------------
      # 1) ソース取得
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2) CMake Configure（preset=release）
      # --------------------------------------------------
      - name: Configure CMake (Release)
        run: |
          call "%VCVARS_BAT%"
          "%CMAKE_BIN%\\cmake.exe" --preset release

      # --------------------------------------------------
      # 3) ビルド（build/release）
      # --------------------------------------------------
      - name: Build (Release)
        run: |
          call "%VCVARS_BAT%"
          "%CMAKE_BIN%\\cmake.exe" --build build/release --config Release

      # --------------------------------------------------
      # 4) テスト実行（ctest）
      #    ctest.exe のフルパスを使う
      # --------------------------------------------------
      - name: Run Tests
        run: |
          call "%VCVARS_BAT%"
          "%CMAKE_BIN%\\ctest.exe" --test-dir build/release -C Release --output-on-failure

      # --------------------------------------------------
      # 5) アーティファクト（exe + DLL + Qt platforms）
      # --------------------------------------------------
      - name: Package artifacts
        run: |
          mkdir artifact
          copy build\release\ImageViewer.exe artifact\

          rem CMakeLists の POST_BUILD で DLL が build\release に揃っている前提
          copy build\release\*.dll artifact\

          rem Qt の platforms ディレクトリがあれば一緒に格納
          if exist build\release\platforms (
            mkdir artifact\platforms
            copy build\release\platforms\*.dll artifact\platforms\
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer
          path: artifact
