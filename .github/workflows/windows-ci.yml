name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) CMake 構成
      - name: Configure CMake
        run: >
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          -S . -B build -G "Visual Studio 17 2022" -A x64

      # 2) ビルド（RelWithDebInfo）
      - name: Build (RelWithDebInfo)
        run: >
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          --build build --config RelWithDebInfo

      # 3) 単体テスト（RelWithDebInfo の exe を実行）
      - name: Run GoogleTest
        working-directory: build/RelWithDebInfo
        run: .\ImageProcTests.exe --gtest_color=yes

      # 4) 静的解析 (Cppcheck)
      - name: Run Cppcheck
        continue-on-error: true
        run: >
          cppcheck
          --enable=all --inconclusive
          --std=c++17 --language=c++
          --platform=win64
          --suppress=missingIncludeSystem
          --output-file=cppcheck-report.txt
          ImageProc ImageViewer

      # 5) カバレッジ (OpenCppCoverage)
      #    - Cobertura XML + HTML レポートを両方出力
      - name: Run OpenCppCoverage
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          --export_type=cobertura:coverage.xml
          --export_type=html:coverage_html
          --sources "${{ github.workspace }}"
          -- "${{ github.workspace }}\build\RelWithDebInfo\ImageProcTests.exe"

      # 6) Summary タブ用の Markdown サマリ出力
      - name: Summarize coverage & cppcheck (Job Summary)
        shell: pwsh
        continue-on-error: true
        run: |
          $summary = @()

          # --- Coverage summary ---
          $coveragePath = "coverage.xml"
          if (Test-Path $coveragePath) {
            try {
              $cov  = [xml](Get-Content $coveragePath)
              $root = $cov.coverage

              $totalLines   = 0
              $coveredLines = 0
              $lineRatePct  = 0

              if ($root.'lines-valid')   { $totalLines   = [int]$root.'lines-valid' }
              if ($root.'lines-covered') { $coveredLines = [int]$root.'lines-covered' }
              if ($root.'line-rate')     { $lineRatePct  = [math]::Round(100 * [double]$root.'line-rate', 1) }

              $summary += "## Code Coverage"
              $summary += ""
              $summary += "| Metric        | Value |"
              $summary += "|--------------|------:|"
              $summary += "| Lines covered | $coveredLines |"
              $summary += "| Total lines   | $totalLines |"
              $summary += "| Line rate     | $lineRatePct% |"
              $summary += ""
              $summary += "| File | Line % | Covered / Total |"
              $summary += "|------|-------:|----------------:|"

              if ($cov.coverage.packages.package) {
                foreach ($pkg in $cov.coverage.packages.package) {
                  if (-not $pkg.classes.class) { continue }
                  foreach ($cls in $pkg.classes.class) {
                    $file       = $cls.filename
                    $clsTotal   = 0
                    $clsCovered = 0
                    $clsRatePct = 0

                    if ($cls.'lines-valid')   { $clsTotal   = [int]$cls.'lines-valid' }
                    if ($cls.'lines-covered') { $clsCovered = [int]$cls.'lines-covered' }
                    if ($cls.'line-rate')     { $clsRatePct = [math]::Round(100 * [double]$cls.'line-rate', 1) }

                    $summary += "| $file | $clsRatePct% | $clsCovered / $clsTotal |"
                  }
                }
              }
            }
            catch {
              $summary += ""
              $summary += "Coverage summary generation failed: $($_.Exception.Message)"
            }
          }

          # --- Cppcheck summary ---
          $cppPath = "cppcheck-report.txt"
          if (Test-Path $cppPath) {
            try {
              $lines      = Get-Content $cppPath
              $errorCount = ($lines | Select-String " error:").Count
              $warnCount  = ($lines | Select-String " warning:").Count
              $infoCount  = ($lines | Select-String " information:").Count

              $summary += ""
              $summary += "## Cppcheck"
              $summary += ""
              $summary += "| Severity | Count |"
              $summary += "|---------|------:|"
              $summary += "| error   | $errorCount |"
              $summary += "| warning | $warnCount |"
              $summary += "| info    | $infoCount |"
            }
            catch {
              $summary += ""
              $summary += "Cppcheck summary generation failed: $($_.Exception.Message)"
            }
          }

          if ($summary.Count -gt 0) {
            $summaryText = $summary -join "`n"
            $summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      # 7) レポートアップロード（テキスト + HTML レポート）
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-reports
          path: |
            cppcheck-report.txt
            coverage.xml
            coverage_html/
            build/RelWithDebInfo/ImageProcTests.exe
