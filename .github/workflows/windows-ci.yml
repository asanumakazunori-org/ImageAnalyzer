name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ############################################################
      # 1) CMake Configure: Visual Studio 2026 (MSVC v144)
      ############################################################
      - name: Configure CMake (VS2026)
        run: >
          & "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          -S . -B build -G "Visual Studio 18 2026" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/work/vcpkg/scripts/buildsystems/vcpkg.cmake

      ############################################################
      # 2) Build
      ############################################################
      - name: Build (RelWithDebInfo)
        run: >
          & "C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          --build build --config RelWithDebInfo

      ############################################################
      # 3) Deploy DLLs using windeployqt (Qt 6.10 + msvc2022_64)
      ############################################################
      # ※ Qt が Visual Studio 2026 用バイナリをまだ提供していないため、
      #    現時点では msvc2022_64 のままで OK。
      ############################################################
      - name: Deploy Qt + OpenCV DLLs (windeployqt)
        shell: powershell
        run: |
          $viewer = "build/RelWithDebInfo/StereoCameraViewer.exe"
          if (!(Test-Path $viewer)) {
            Write-Error "StereoCameraViewer.exe not found."
            exit 1
          }

          Write-Host "Running windeployqt..."
          & "C:/Qt/6.10.0/msvc2022_64/bin/windeployqt.exe" `
            $viewer `
            --no-translations `
            --compiler-runtime `
            --release
          Write-Host "windeployqt completed."

      ############################################################
      # 4) Run GoogleTests
      ############################################################
      - name: Run GoogleTest
        working-directory: build/RelWithDebInfo
        run: .\StereoCameraTests.exe --gtest_color=yes --gtest_output=xml:gtest-report.xml

      ############################################################
      # 5) Cppcheck
      ############################################################
      - name: Run Cppcheck
        continue-on-error: true
        run: >
          cppcheck
          --enable=all --inconclusive
          --std=c++17 --language=c++
          --platform=win64
          --suppress=missingIncludeSystem
          --output-file=cppcheck-report.txt
          StereoCameraAnalyzer StereoCameraProc

      ############################################################
      # 6) OpenCppCoverage
      ############################################################
      - name: Run OpenCppCoverage
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          --export_type=cobertura:coverage.xml
          --export_type=html:coverage_html
          --sources "${{ github.workspace }}"
          -- "${{ github.workspace }}\build\RelWithDebInfo\StereoCameraTests.exe"

      ############################################################
      # 7) Summary (GoogleTest + Coverage + Cppcheck)
      ############################################################
      - name: Summarize results
        shell: powershell
        continue-on-error: true
        run: |
          $summary = @()

          # -------- GoogleTest Summary --------
          $gtestPath = "build/RelWithDebInfo/gtest-report.xml"
          if (Test-Path $gtestPath) {
            try {
              [xml]$gxml = Get-Content $gtestPath
              $root = $gxml.testsuites

              $total    = [int]$root.tests
              $failures = [int]$root.failures
              $disabled = [int]$root.disabled
              $skipped  = 0
              if ($root.skipped) { $skipped = [int]$root.skipped }
              $errors   = 0
              if ($root.errors) { $errors = [int]$root.errors }

              $passed = $total - $failures - $disabled - $skipped - $errors

              $summary += "## GoogleTest"
              $summary += "| Metric | Count |"
              $summary += "|--------|------:|"
              $summary += "| Total  | $total |"
              $summary += "| Passed | $passed |"
              $summary += "| Failed | $failures |"
              $summary += "| Disabled | $disabled |"
              if ($errors -gt 0) {
                $summary += "| Errors | $errors |"
              }

            } catch {
              $summary += "GoogleTest summary error: $($_.Exception.Message)"
            }
          }

          # -------- Code Coverage Summary --------
          $coveragePath = "coverage.xml"
          if (Test-Path $coveragePath) {
            try {
              [xml]$cov = Get-Content $coveragePath
              $counterNodes = $cov.coverage.packages.package.classes.class.lines.line

              $totalLines = 0
              $coveredLines = 0

              foreach ($line in $counterNodes) {
                $totalLines++
                if ($line.hits -gt 0) {
                  $coveredLines++
                }
              }

              $pct = 0
              if ($totalLines -gt 0) {
                $pct = [math]::Round(100.0 * $coveredLines / $totalLines, 1)
              }

              $summary += ""
              $summary += "## Code Coverage"
              $summary += "| Metric | Value |"
              $summary += "|--------|------:|"
              $summary += "| Covered lines | $coveredLines |"
              $summary += "| Total lines   | $totalLines |"
              $summary += "| Coverage %    | $pct% |"

            } catch {
              $summary += "Coverage summary error: $($_.Exception.Message)"
            }
          }

          # -------- Cppcheck Summary --------
          if (Test-Path "cppcheck-report.txt") {
            $summary += ""
            $summary += "## Cppcheck"
            $issues = @()
            foreach ($l in Get-Content "cppcheck-report.txt") {
              if ($l -match '^(?<file>[^:]+):(?<line>\d+):\d+:\s+(?<sev>\w+):\s+(?<msg>.+)$') {
                $issues += $matches
              }
            }
            $summary += "| Severity | Count |"
            $summary += "|---------|------:|"
            if ($issues.Count -gt 0) {
              $sev = $issues | Group-Object Severity
              foreach ($g in $sev) {
                $summary += "| $($g.Name) | $($g.Count) |"
              }
            } else {
              $summary += "| (none) | 0 |"
            }
          }

          if ($summary.Count -gt 0) {
            ($summary -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      ############################################################
      # 8) Upload artifacts
      ############################################################
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-reports
          path: |
            cppcheck-report.txt
            coverage.xml
            coverage_html/
            build/RelWithDebInfo/gtest-report.xml
            build/RelWithDebInfo/StereoCameraTests.exe
            build/RelWithDebInfo/StereoCameraViewer.exe
