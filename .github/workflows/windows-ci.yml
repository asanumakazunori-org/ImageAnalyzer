name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on:
      - self-hosted
      - windows
      - x64

    defaults:
      run:
        shell: cmd

    steps:
      # --------------------------------------------------
      # 1) Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2) MSVC 環境セット + CMake Configure
      #    ※ vcvars64.bat と cmake を 1 つの cmd ステップで実行
      # --------------------------------------------------
      - name: Configure CMake (Release)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" --preset release

      # --------------------------------------------------
      # 3) Build
      #    ※ ここでも vcvars64.bat をロードする必要がある
      # --------------------------------------------------
      - name: Build (Release)
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" --build build/release --config Release

      # --------------------------------------------------
      # 4) Test
      # --------------------------------------------------
      - name: Run Tests
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe" --test-dir build/release -C Release --output-on-failure

      # --------------------------------------------------
      # 5) Artifacts
      # --------------------------------------------------
      - name: Package artifacts
        run: |
          mkdir artifact
          copy build\release\ImageViewer.exe artifact\
          copy build\release\*.dll artifact\
          mkdir artifact\platforms
          copy build\release\platforms\*.dll artifact\platforms\

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer
          path: artifact
