name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-analysis:
    runs-on: self-hosted

    steps:
      # ------------------------------
      # 1) リポジトリ取得
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # 2) CMake configure（vcpkg toolchain 使用）
      # ------------------------------
      - name: Configure CMake (Release)
        run: >
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          --preset release

      # ------------------------------
      # 3) ビルド（Release）
      # ------------------------------
      - name: Build (Release)
        run: >
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          --build build/release --config Release

      # ------------------------------
      # 4) テスト実行
      # ------------------------------
      - name: Run Tests
        run: >
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\ctest.exe"
          --test-dir build/release -C Release --output-on-failure

      # ------------------------------
      # 5) アーティファクト生成（exe + DLL）
      # ------------------------------
      - name: Package artifacts
        run: |
          mkdir artifact
          copy build/release/ImageViewer.exe artifact/
          copy build/release/*.dll artifact/ 2>$null || true
          copy build/release/platforms/*.dll artifact/platforms/ 2>$null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer
          path: artifact
